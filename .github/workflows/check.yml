name: Checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e .
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check personaweave/web/app.js
      - run: node --check personaweave/web/upstream.js

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - run: npm install --prefix .test-runtime --ignore-scripts --save-exact @deepseek-ai/dsh@0.2.1-rc.5
      - name: Real DSH with local model and protocol integration tests
        env:
          PW_DSH_BIN: ${{ github.workspace }}/.test-runtime/node_modules/@deepseek-ai/dsh/lib/bin.js
        run: python -m unittest discover -s tests -v
      - name: Browser workflows
        run: python tests/ui/smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PersonaWeave-UI-verification
          path: test-results/
