name: Windows software
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and test desktop application
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Test frozen HTTP service and bundled web assets
        shell: pwsh
        run: |
          $process = Start-Process dist/PersonaWeave/PersonaWeave.exe -ArgumentList '--browser','--port','18742','--data',"$env:RUNNER_TEMP/PersonaWeaveSmoke" -PassThru
          try {
            $ready = $false
            for ($attempt=0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-WebRequest http://127.0.0.1:18742/ -UseBasicParsing
                if ($response.Content -match 'PersonaWeave') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Frozen application startup failed.' }
            $script = Invoke-WebRequest http://127.0.0.1:18742/app.js -UseBasicParsing
            if ($script.StatusCode -ne 200) { throw 'Bundled assets unavailable.' }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { $h = Get-FileHash $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: PersonaWeave-Windows-x64
          path: |
            dist/*Portable.zip
            dist/*Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
