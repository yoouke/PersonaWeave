[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "personaweave"
version = "0.1.0"
description = "织灵 — local-first DIY AI persona host for DSH and QQ"
requires-python = ">=3.11"
dependencies = ["websockets>=13,<16", "psutil>=6,<8", "keyring>=25,<26"]
[project.optional-dependencies]
desktop = ["pywebview>=5,<7", "pystray>=0.19", "Pillow>=10", "pyinstaller>=6"]
[project.scripts]
personaweave = "personaweave.__main__:main"
[tool.setuptools.package-data]
personaweave = ["web/*"]
[tool.setuptools.packages.find]
include = ["personaweave*"]
exclude = ["tests*", "packaging*"]
